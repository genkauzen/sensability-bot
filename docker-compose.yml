services:
  sensability:
    build: .
    container_name: sensability
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # По умолчанию бот ищет whitelist здесь первым: timewebcloud_subnets.txt, selectel_subnets.txt, regru_subnets.txt
      - .:/compose
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
